</circle><text x="314.9999754130838" y="488.20508334244374" text-anchor="middle" font-size="13">N2</text><text x="314.9999754130838" y="526.2050833424437" text-anchor="middle" font-size="12">receiver</text><text x="30" y="567" font-size="12">Orange: removal lowers score · Blue: raises score · Gray: negligible change · Purple dashed: target</text><text x="30" y="593" font-size="12">Node aliases are report-local. No fraud labels are inferred from graph position or importance.</text></svg>