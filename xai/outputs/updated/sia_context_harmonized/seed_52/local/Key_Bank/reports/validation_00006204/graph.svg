<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img"><title>Temporal graph perturbation</title><rect width="100%" height="100%" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172033}</style><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="context-stroke"/></marker></defs><text x="30" y="32" font-size="22">Historical interaction influence</text><text x="30" y="57" font-size="13">Temporal graph perturbation · width = absolute probability change on removal</text><path d="M810.0,310.00000874227766 Q480.00000039737625,295.0 174.0,309.99999189352434" fill="none" stroke="#0284c7" stroke-width="6.50" opacity=".7" marker-end="url(#arrow)"><title>Removal delta: +0.0025428</title></path><path d="M810.0,310.00000874227766 L150.0,309.99999125772234" stroke="#7c3aed" stroke-width="4" stroke-dasharray="8 5" fill="none"><title>Target transaction</title></path><circle cx="810.0" cy="310.00000874227766" r="24" fill="#ddd6fe" stroke="#334155" stroke-width="5.00"><title>Bank-local node 4189; incident-update removal delta: +0.0025428</title></circle><text x="810.0" y="315.00000874227766" text-anchor="middle" font-size="13">N1</text><text x="810.0" y="353.00000874227766" text-anchor="middle" font-size="12">sender</text><circle cx="150.0" cy="309.99999125772234" r="24" fill="#ddd6fe" stroke="#334155" stroke-width="5.00"><title>Bank-local node 5219; incident-update removal delta: +0.0025428</title></circle><text x="150.0" y="314.99999125772234" text-anchor="middle" font-size="13">N2</text><text x="150.0" y="352.99999125772234" text-anchor="middle" font-size="12">receiver</text><text x="30" y="567" font-size="12">Orange: removal lowers score · Blue: raises score · Gray: negligible change · Purple dashed: target</text><text x="30" y="593" font-size="12">Node aliases are report-local. No fraud labels are inferred from graph position or importance.</text></svg>